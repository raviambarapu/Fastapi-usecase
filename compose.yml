services:

  api:
    build: .
    container_name: fastapi_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - fastapi_network

  db:
    image: postgres:16
    container_name: fastapi_auth_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ravi@8985
      POSTGRES_DB: fastapi_auth_jwt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_auth_jwt"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastapi_network

volumes:
  postgres_data:
  uploads_data:

networks:
  fastapi_network: